# Response headers of every location. nginx drops the server-level add_header
# directives in a location that has its own, so each such location includes this
# file again.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
# The application loads nothing from other origins: scripts, styles, fonts and
# images are bundled, and the API and the websocket are on this origin. Style
# attributes stay allowed for the libraries that set them inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
